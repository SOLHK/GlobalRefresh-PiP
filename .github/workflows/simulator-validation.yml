name: iPhone simulator validation
on:
  workflow_dispatch:
  push:
    branches: [codex/power-saving-beta2, codex/stra-beta9, codex/stra-2.0]
    paths: ['pip_swift/**', 'ci/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate SOLHK app icons
        run: python3 ci/generate-solhk-icons.py
      - name: Configure hosted XCTest and UI test targets
        run: |
          gem install --user-install xcodeproj --no-document
          ruby ci/configure-simulator-tests.rb
      - name: Select and boot an available iPhone
        run: |
          set -euo pipefail
          XCODE27=""
          for candidate in /Applications/Xcode*.app; do
            [ -d "$candidate" ] || continue
            build=$(/usr/libexec/PlistBuddy -c "Print :ProductBuildVersion" "$candidate/Contents/version.plist" 2>/dev/null || true)
            if [ "$build" = "27A266a" ]; then XCODE27="$candidate"; break; fi
          done
          if [ -z "$XCODE27" ]; then echo "::error::Released Xcode 27 (27A266a) unavailable"; exit 1; fi
          echo "DEVELOPER_DIR=$XCODE27/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE27/Contents/Developer"
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 27.0"
          xcrun simctl list devices available -j > /tmp/simulators.json
          DEVICE_ID=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/simulators.json'))['devices']
          candidates=[(runtime,d) for runtime,devices in data.items() if 'iOS' in runtime for d in devices if d['isAvailable'] and d['name'].startswith('iPhone')]
          runtime,device=sorted(candidates,key=lambda x:(x[0], 'Pro' in x[1]['name'], x[1]['name']))[-1]
          print(device['udid'])
          PY
          )
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl erase "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Run app-hosted lifecycle tests and UI tests
        run: |
          set -o pipefail
          xcodebuild test -workspace pip_swift/pip_swift.xcworkspace -scheme SimulatorValidation -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath simulator-build -resultBundlePath SimulatorResults.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee simulator-tests.log
      - name: Collect test report and screen capture
        if: always()
        run: |
          mkdir -p simulator-evidence
          cp simulator-tests.log simulator-evidence/ 2>/dev/null || true
          xcrun simctl io "$SIMULATOR_ID" screenshot simulator-evidence/final-screen.png || true
          xcrun xcresulttool get test-results summary --path SimulatorResults.xcresult --format json > simulator-evidence/summary.json || true
          xcrun xcresulttool export attachments --path SimulatorResults.xcresult --output-path simulator-evidence/attachments || true
          cat simulator-evidence/summary.json
          sips -Z 640 -s format jpeg -s formatOptions 55 simulator-evidence/final-screen.png --out /tmp/simulator-screen.jpg >/dev/null || true
          python3 -c 'import pathlib,base64; p=pathlib.Path("/tmp/simulator-screen.jpg"); print("SIM_SCREEN_BASE64="+base64.b64encode(p.read_bytes()).decode()) if p.exists() else None'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-simulator-test-results
          path: |
            simulator-evidence
            SimulatorResults.xcresult

