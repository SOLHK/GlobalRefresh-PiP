name: Build unsigned optimized IPA
on:
  workflow_dispatch:
  push:
    branches: [master, codex/power-saving-beta2, codex/stra-beta9]
    paths:
      - 'pip_swift/**'
      - 'ci/**'
      - '.github/workflows/build-optimized.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SOLHK app icons
        run: python3 ci/generate-solhk-icons.py
      - name: Build for iPhone
        run: |
          xcodebuild -version
          xcodebuild -workspace pip_swift/pip_swift.xcworkspace -scheme pip_swift -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/pip_swift.app package/Payload/
          cd package
          zip -qry ../STRA-high-refresh-1.1.1-beta9-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: STRA-high-refresh-1.1.1-beta9-unsigned
          path: STRA-high-refresh-1.1.1-beta9-unsigned.ipa

